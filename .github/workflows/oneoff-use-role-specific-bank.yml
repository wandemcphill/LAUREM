name: oneoff-use-role-specific-bank
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch interview bank
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/laurem-interview-banks.ts')
          s=p.read_text()
          old="  const templates = [...commonObjectiveTemplates, ...roleSpecificObjectiveTemplates];"
          new="  const templates = [...commonObjectiveTemplates.slice(0, 20), ...roleSpecificObjectiveTemplates];"
          if old not in s: raise SystemExit('round one template selector not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/oneoff-use-role-specific-bank.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: include role-specific round one questions"
          git push origin main
