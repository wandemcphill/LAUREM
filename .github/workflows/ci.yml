name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0

      - name: Bootstrap or install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

      - name: Application health smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm start -- -p 10000 > /tmp/laurem-health.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:10000/api/health > /tmp/laurem-health-response.json; then
              node -e "const fs=require('node:fs'); const body=JSON.parse(fs.readFileSync('/tmp/laurem-health-response.json','utf8')); if(body.ok!==true || body.service!=='laurem-recruitment-platform' || body.database?.ok!==true) process.exit(1);"
              exit 0
            fi
            sleep 1
          done

          cat /tmp/laurem-health.log
          cat /tmp/laurem-health-response.json 2>/dev/null || true
          exit 1
